# version: "3.3"

services:
  postgres:
    container_name: pg_crisv2
    image: postgres:16
    environment:
      - POSTGRES_DB=crisv2
      - POSTGRES_USER=cris
      - POSTGRES_PASSWORD=${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in backend/.env}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cris -d crisv2"]
      interval: 5s
      timeout: 3s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@mail.com
      - PGADMIN_DEFAULT_PASSWORD=${LOCAL_PGADMIN_PASSWORD:?Set LOCAL_PGADMIN_PASSWORD in backend/.env}
    ports:
      - 127.0.0.1:5050:80
